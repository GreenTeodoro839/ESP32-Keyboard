[pytest]
# Run from the project root:  .venv/bin/python -m pytest tests            (default subset)
#                             .venv/bin/python -m pytest tests -m ""      (everything)
#                             .venv/bin/python -m pytest tests/offline    (no hardware needed)
testpaths = .
pythonpath = ../tools .
addopts = -ra --strict-markers -m "not slow and not wifi and not reboot and not serial and not ota"
markers =
    slow: long hardware tests (more than ~15 s each); excluded by default
    wifi: takes the test hotspot down and up (nmcli connection down/up espkb-test); excluded by default
    reboot: reboots or resets the device; excluded by default
    serial: uses the debug serial console; excluded by default
    ota: uploads a firmware image and writes it to flash, usually rebooting into it (tests/test_ota.py); excluded by default
    no_hid: needs the device on the network but not the USB HID harness (the test never produces HID output)
    hw: needs the real device (added automatically to every test outside tests/offline)
