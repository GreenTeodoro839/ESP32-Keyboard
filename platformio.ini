; ============================================================
;  ESPKB firmware - ESP32-S3 N16R8 (16 MB QIO flash + 8 MB octal PSRAM)
;  Build:  pio run            Flash:  pio run -t upload
;  The web page web/index.html is gzipped into the firmware on every build
;  by scripts/embed_web.py (falls back to a placeholder if it is missing).
; ============================================================

[platformio]
; Optional, git-ignored: per-machine settings such as upload_port / monitor_port.
extra_configs = platformio_local.ini

[env:esp32-s3-devkitc-1]
platform  = espressif32          ; 8.0.0, ESP-IDF 6.1
board     = esp32-s3-devkitc-1
framework = espidf

board_upload.flash_size = 16MB
board_build.flash_mode  = qio
board_build.partitions  = partitions.csv

extra_scripts = pre:scripts/embed_web.py

; UART port (CH343 bridge -> UART0): flashing, logs and the serial console.
; Auto-detected by default. With both USB ports plugged in, pin it in platformio_local.ini (see README).
upload_speed  = 460800
monitor_speed = 115200
