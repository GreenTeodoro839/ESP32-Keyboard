; ============================================================
;  ESPKB firmware - ESP32-S3 SuperMini (ESP32-S3FH4R2: 4 MB QIO flash + 2 MB quad PSRAM)
;  Build:  pio run            Flash:  pio run -t upload  (USB-C / USB Serial/JTAG)
;  The web page web/index.html is gzipped into the firmware on every build
;  by scripts/embed_web.py (falls back to a placeholder if it is missing).
; ============================================================

[platformio]
; Optional, git-ignored: per-machine settings such as upload_port / monitor_port.
extra_configs = platformio_local.ini

[env:esp32-s3-devkitc-1]
platform  = espressif32          ; 8.0.0, ESP-IDF 6.1
board     = esp32-s3-devkitc-1
framework = espidf

board_upload.flash_size = 4MB
board_build.flash_mode  = qio
board_build.partitions  = partitions.csv

extra_scripts = pre:scripts/embed_web.py

; Single USB-C port, wired to the chip's native USB (no UART bridge).
; Flashing uses the ROM's USB Serial/JTAG interface; once the app runs the same
; port is the HID keyboard/mouse. Auto-detected by default; pin it in
; platformio_local.ini if needed (see README).
upload_speed  = 460800
monitor_speed = 115200
